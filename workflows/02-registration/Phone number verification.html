<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Boarding</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="./Phone nmber verification.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .hidden { display: none !important; }

        .illustration-wrap {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .illustration-wrap .instruction-text,
        .illustration-wrap .heali-with-phone-img {
            margin-bottom: 0;
        }

        .boarding-header {
            padding-bottom: 20px; /* Reduces the gap below the title */
        }

        .main-title {
            font-size: 28px;
            font-weight: 700;
            color: #143c8e;
            margin-top: 20px;
        }
        /* Social Footer & Buttons Styling */
        .social-footer {
            text-align: center;
            padding: var(--spacing-xl) var(--container-padding);
            margin-top: auto; /* Pushes the footer to the bottom of the screen */
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .support-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .support-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <header class="boarding-header">
            <div class="illustration-wrap">
                <p class="instruction-text" id="instruction-text">
                    We will send you a one-time password to verify your account.
                </p>
                <img src="../../assets/images/heali with phone.png" alt="Heali" class="heali-with-phone-img">
            </div>
            <h1 class="main-title" id="display-title">Enter Phone Number</h1>
        </header>

        <main class="form-section" id="phone-state">
            <label for="phone" class="input-label">Phone Number</label>
            <div class="phone-input-wrapper">
                <div class="country-selector" style="width: auto; min-width: 85px; padding: 0 8px;">
                    <select id="country-code" style="background: transparent; border: none; font-size: 16px; outline: none; cursor: pointer; width: 100%;">
                        <option value="+91" selected>🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+61">🇦🇺 +61</option>
                    </select>
                </div>
                <input type="tel" id="phone" placeholder="000 000 0000" class="phone-field" maxlength="10">
            </div>

            <button type="button" class="btn-primary btn-full" id="generate-btn">
                Generate OTP <span class="arrow">→</span>
            </button>
        </main>

        <main class="form-section hidden" id="otp-state">
            <label class="input-label">Enter Code</label>
            <div class="otp-input-wrapper">
                <input type="text" maxlength="1" class="otp-box" placeholder="0">
                <input type="text" maxlength="1" class="otp-box" placeholder="0">
                <input type="text" maxlength="1" class="otp-box" placeholder="0">
                <input type="text" maxlength="1" class="otp-box" placeholder="0">
                <input type="text" maxlength="1" class="otp-box" placeholder="0">
                <input type="text" maxlength="1" class="otp-box" placeholder="0">
            </div>
            
            <div class="resend-container" style="text-align: center; margin-bottom: 20px;">
                <a href="#" class="resend-link" style="color: #1A202C; font-size: 14px; font-weight: 600;">Resend Code</a>
            </div>

            <a href="./account verified.html" class="btn-primary btn-full" id="verify-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                Verify
            </a>
        </main>

        <footer class="social-footer">
            <div class="social-buttons">
                <button class="social-btn"><img src="../../assets/images/Google.png" alt="Google"> Google</button>
                <button class="social-btn"><img src="../../assets/images/Apple.png" alt="Apple"> Apple</button>
            </div>
            <p class="support-text">Having trouble? <a href="#">Contact Support</a></p>
        </footer>
    </div>

    <script src="../../js/phone verification.js"></script>
</body>
</html>
