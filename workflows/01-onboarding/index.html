<!DOCTYPE html>
<html lang="en">
<!-- =======================================================================
     HEAD SECTION
     ======================================================================= -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Welcome</title>
    <!-- Link to global styles for shared components and variables -->
    <link rel="stylesheet" href="../../css/global.css" />
    <meta name="view-transition" content="same-origin" />
</head>

<!-- =======================================================================
     BODY SECTION
     ======================================================================= -->
<body>
    <div class="mobile-container">
        <main>
            <!-- ===================================================================
                 HERO SECTION: Logo, Headers, and Features
                 =================================================================== -->
            <header class="hero">
                <!-- Branding Header -->
                <div class="hero_center">
                    <img class="onboarding-logo" src="../../assets/images/Logo.png" alt="Telehealings Logo">
                    <h1 id="mainheader">Telehealings</h1>
                    <h3 id="subheader">Continuity-First Wellness Care Platform</h3>
                </div>
                
                <!-- Features List 1: Platform Capabilities -->
                <section class="features_1" aria-label="Platform Capabilities">
                    <ul>
                        <li>AI-Powered Conversational Partner</li>
                        <li>Therapist Handover Continuity</li>
                        <li>Self-Help Library</li>
                    </ul>
                </section>
                
                <!-- Spacer for visual separation -->
                <div class="spacing" aria-hidden="true"></div>
                
                <!-- Features List 2: Platform Stats -->
                <section class="features_2" aria-label="Platform Statistics">
                    <ul>
                        <li><span>200+</span> Verified Therapists</li>
                        <li><span>8+</span> Languages</li>
                        <li><span>1000+</span> Therapy Hours</li>
                    </ul>
                </section>
            </header>

            <!-- ===================================================================
                 CALL TO ACTION (CTA) SECTION
                 =================================================================== -->
            <section class="cta" aria-label="Call to Action">
                <!-- Mascot/Avatar Image -->
                <img class="heali heali-overlap" src="../../assets/images/Heali.png" alt="Heali AI Assistant">
                
                <!-- CTA Text and Button -->
                <div class="cta_2">
                    <ul class="cta_text">
                        <li>Your wellness journey is</li>
                        <li>one click away</li>
                    </ul>
                    <!-- Proceed to soft onboarding -->
                    <a href="./softonboarding.html" class="cta-button-round" aria-label="Start your journey">→</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
