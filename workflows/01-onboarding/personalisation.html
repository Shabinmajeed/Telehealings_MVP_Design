<!DOCTYPE html>
<html lang="en">
<!-- =======================================================================
     HEAD SECTION
     ======================================================================= -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Personalisation</title>
    <link rel="stylesheet" href="../../css/global.css"/>
    <!-- FontAwesome CDN for high-quality internet icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Inherited Hero Section */
        .hero {
            background-image: url(/assets/images/Wave.png);
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            padding-top: 50px;
            padding-bottom: 30px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ==========================================================================
           PERSONALISATION PAGE SPECIFIC STYLES
           ========================================================================== */

        /* Main container element - uses flex for layout */
        main {
            width: 100%;
            max-width: var(--screen-max-width);
            height: 100vh;
            max-height: 800px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        @media (min-height: 800px) {
            main {
                border-radius: var(--border-radius-phone);
            }
        }

        /* Header Navigation Line */
        .first-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            margin-bottom: var(--spacing-md);
        }

        .back-button {
            text-decoration: none;
            font-size: 24px;
            color: var(--primary-color);
            font-weight: bold;
            width: 40px;
            transition: opacity 0.2s ease;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .back-button:hover {
            opacity: 0.7;
        }

        #heading {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.25rem;
            margin: 0;
            flex-grow: 1;
            font-weight: 700;
        }

        #text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin: 0 20px;
            line-height: 1.4;
        }

        /* Selection Grid */
        .selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            padding: 10px 25px;
            flex-grow: 1;
            align-content: center;
        }
    </style>
</head>

<!-- =======================================================================
     BODY SECTION
     ======================================================================= -->
<body>
    <main>
        <!-- ===================================================================
             HERO SECTION: Header and Welcome Text
             =================================================================== -->
        <header class="hero">
            <div class="first-line">
                <!-- Back navigation -->
                <a href="./softonboarding.html" class="back-button" aria-label="Go back"> ← </a>
                
                <!-- Page Title -->
                <h1 id="heading">What brings you here?</h1>
                
                <!-- Avatar/Logo -->
                <img src="../../assets/images/Heali.png" alt="Heali AI" class="heali">
            </div>

            <p id="text">
                Choose what you'd like to focus on first. We'll personalize your journey based on your needs.
            </p>
        </header>

        <!-- ===================================================================
             SELECTION SECTION: Grid of Focus Areas
             =================================================================== -->
        <section class="selection" aria-label="Focus Areas">
            
            <!-- Card 01: Stress -->
            <button class="card" aria-pressed="false">
                <div class="card-icon"><i class="fa-solid fa-cloud-bolt"></i></div>
                <div class="card-name">Stress</div>
                <div class="card-details">Managing daily pressure</div>
            </button>
            
            <!-- Card 02: Anxiety -->
            <button class="card" aria-pressed="false">
                <div class="card-icon"><i class="fa-solid fa-heart-pulse"></i></div>
                <div class="card-name">Anxiety</div>
                <div class="card-details">Calming your mind</div>
            </button>
            
            <!-- Card 03: Sleep -->
            <button class="card" aria-pressed="false">
                <div class="card-icon"><i class="fa-solid fa-moon"></i></div>
                <div class="card-name">Sleep</div>
                <div class="card-details">Better rest</div>
            </button>
            
            <!-- Card 04: Relationships -->
            <button class="card" aria-pressed="false">
                <div class="card-icon"><i class="fa-solid fa-user-group"></i></div>
                <div class="card-name">Relationships</div>
                <div class="card-details">Building connections</div>
            </button>
            
            <!-- Card 05: Self-esteem -->
            <button class="card" aria-pressed="false">
                <div class="card-icon"><i class="fa-solid fa-seedling"></i></div>
                <div class="card-name">Self-esteem</div>
                <div class="card-details">Building confidence</div>
            </button>
            
            <!-- Card 06: Focus -->
            <button class="card" aria-pressed="false">
                <div class="card-icon"><i class="fa-solid fa-bullseye"></i></div>
                <div class="card-name">Focus</div>
                <div class="card-details">Improving concentration</div>
            </button>

        </section>
           
        <!-- ===================================================================
             ACTION SECTION: Continue Button
             =================================================================== -->
        <a href="../Home.html" class="btn-primary disabled" id="continueBtn">Continue</a>
    </main>

    <!-- Logic to handle card selection and enable/disable continue button -->
    <script>
        const cards = document.querySelectorAll('.card');
        const continueBtn = document.getElementById('continueBtn');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Toggle the aria-pressed state to track selection
                const isSelected = card.getAttribute('aria-pressed') === 'true';
                card.setAttribute('aria-pressed', !isSelected);
                
                // Check if any card has aria-pressed="true"
                const anySelected = document.querySelectorAll('.card[aria-pressed="true"]').length > 0;
                
                // Toggle the disabled class on the button accordingly
                if (anySelected) {
                    continueBtn.classList.remove('disabled');
                } else {
                    continueBtn.classList.add('disabled');
                }
            });
        });
    </script>
</body>
</html>
