<!DOCTYPE html>
<html lang="en">
<!-- =======================================================================
     HEAD SECTION
     ======================================================================= -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Onboarding</title>
    <link rel="stylesheet" href="../../css/global.css"/>
    <style>
        /**
         * ============================================================================
         * SOFT ONBOARDING STYLES
         * ============================================================================
         * Specific styles for the soft onboarding workflow.
         */
        
        /* ==========================================================================
           Base Layout
           ========================================================================== */
        
        /* Main content area styles */
        main {
            width: 100%;
            height: 100vh;
            max-height: 800px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            position: relative;
        }
        
        @media (min-height: 800px) {
            main {
                border-radius: var(--border-radius-phone);
            }
        }
        
        /* ==========================================================================
           Hero Section
           ========================================================================== */
        .hero {
            background-image: url(/assets/images/Wave.png);
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            padding-top: 50px;
            padding-bottom: 30px;
            text-align: center;
            flex-shrink: 0;
        }
        
        /* ==========================================================================
           Typography & Headers
           ========================================================================== */
        #mainheader {
            color: var(--primary-color);
            font-size: 1.75rem;
            margin: 0 0 5px 0;
            font-weight: 700;
        }
        
        #subheader {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0 0 35px 0;
        }
        
        #question {
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 500;
            margin-top: 20px;
            margin-bottom: 0;
        }
        
        /* ==========================================================================
           Terms & Conditions
           ========================================================================== */
        #terms-container {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
        }
        
        #terms {
            margin-top: 2px;
            accent-color: var(--primary-color);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        label {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        
        label span {
            color: var(--primary-color);
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
    <meta name="view-transition" content="same-origin" />
</head>   

<!-- =======================================================================
     BODY SECTION
     ======================================================================= -->
<body>
    <main>
        <!-- ===================================================================
             HERO SECTION: Greeting and Image
             =================================================================== -->
        <header class="hero">
            <h1 id="mainheader">Hi I'm Heali</h1>
            <p id="subheader">AI Powered Healing Partner</p>
            <img src="../../assets/images/Heali.png" alt="Heali AI" class="heali-avatar">
            <p id="question">"What should we call you?"</p>
        </header>

        <!-- ===================================================================
             FORM SECTION: Input, Terms, and Action
             =================================================================== -->
        <form action="./personalisation.html" method="GET">
            <label for="userName" class="sr-only">Your Name</label>
            <input type="text" id="userName" name="userName" placeholder="Your name" class="input-standard">
            
            <div id="terms-container">
                <input type="checkbox" id="terms" custom="tick" required>
                <label for="terms">
                    by continuing, you agree to our <span>Terms and Privacy Policy</span>
                </label>
            </div>

            <!-- ===================================================================
                 ACTION SECTION: Continue Button
                 =================================================================== -->
            <button type="submit" class="btn-primary disabled" id="submitBtn" disabled>Continue →</button>

            <div class="existing-user" style="text-align: center; margin-top: 20px;">
                <p style="font-size: 14px;">Already have an account? <a href="../Home.html" style="color: #007AFF; text-decoration: none; font-weight: 300; font-size: 12px;">Log in</a></p>
            </div>
        </form>
    </main>

    

    <!-- Logic to validate the form before enabling the submit button -->
    <script>
        const userNameInput = document.getElementById('userName');
        const termsCheckbox = document.getElementById('terms');
        const submitBtn = document.getElementById('submitBtn');

        function validateForm() {
            const isNameValid = userNameInput.value.trim().length >= 3;
            const isTermsChecked = termsCheckbox.checked;

            // Enable button only if both conditions are met
            submitBtn.disabled = !(isNameValid && isTermsChecked);
            submitBtn.classList.toggle('disabled', submitBtn.disabled);
        }

        userNameInput.addEventListener('input', validateForm);
        termsCheckbox.addEventListener('change', validateForm);
    </script>
</body>
</html>
