<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Contact Details Form</title>
    
    <link rel="stylesheet" href="../../css/global.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Maintaining all your existing styles */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) var(--container-padding) var(--spacing-sm);
        }
        
        .back-btn {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 20px;
        }
        
        .header-title {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
        }
        
        .progress-container {
            display: flex;
            gap: var(--spacing-sm);
            padding: 0 var(--spacing-2xl);
            margin-bottom: var(--spacing-sm);
        }
        
        .step {
            height: 6px;
            flex: 1;
            background: var(--border-light);
            border-radius: var(--border-radius-pill);
        }
        
        .step.active {
            background: var(--primary-color);
        }
        
        .info-box {
            background-color: var(--bg-subtle);
            border: 1px solid var(--blue-accent);
            border-radius: var(--border-radius-xl);
            margin: 0 var(--container-padding) 0;
            padding: 8px var(--spacing-md);
            display: flex;
            gap: var(--spacing-md);
            align-items: flex-start;
        }
        
        .info-box i {
            color: var(--primary-color);
            margin-top: 2px;
        }
        
        .info-box p {
            font-size: 12px;
            color: var(--text-light);
            margin: 0;
            line-height: 1.4;
        }
        
        .profile-form {
            padding: 0 var(--container-padding) var(--spacing-md);
        }

        /* Override global form padding to prevent unwanted large gaps */
        .profile-form form {
            padding: var(--spacing-md) 0 0 0;
        }
        
        .form-group {
            margin-bottom: var(--spacing-sm);
        }
        
        .input-wrapper .input-border {
            width: 100%;
            height: 44px;
            padding-right: 40px;
        }

        /* Specific style for Address Textarea to match your input-border look */
        textarea.input-border {
            height: auto;
            min-height: 60px;
            padding-top: 16px;
            resize: none;
            font-family: inherit;
        }
        
        .icon-right {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            opacity: 0.6;
        }

        .icon-verified {
            color: #22c55e; /* Green for verification checkmark */
            opacity: 1;
        }
        
        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .floating-label {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s ease-in-out;
            background-color: var(--bg-color);
            padding: 0 4px;
        }

        /* Adjusted for textarea since top 50% looks weird there */
        textarea.input-border ~ .floating-label {
            top: 18px;
        }

        .input-border:focus ~ .floating-label,
        .input-border:not(:placeholder-shown) ~ .floating-label,
        .input-border:valid ~ .floating-label {
            top: 0;
            left: 12px;
            font-size: 12px;
            color: var(--primary-color);
            font-weight: 500;
        }

        select.input-border {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        /* Section Heading Styling */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin: var(--spacing-sm) 0 var(--spacing-sm);
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-light);
        }

        /* Remove top margin for the first section title to prevent double spacing */
        .section-title:first-of-type {
            margin-top: 0;
        }
        
        .btn-primary.btn-full {
            margin-top: var(--spacing-md);
            margin-bottom: 0;
            width: 100%;
        }

        .spacing {
            height: 10px;
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        
        <header class="profile-header">
            <a href="#" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1 class="header-title">Contact Details</h1>
            <img src="../../assets/images/Heali.png" alt="Heali Mascot" class="heali-small" style="margin: 0;">
        </header>
        
        <div class="progress-container">
            <div class="step active"></div>
            <div class="step active"></div>
            <div class="step"></div>
        </div>
        
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <p>This information is used only for identity verification and is never shared with third parties.</p>
        </div>
        
        <main class="profile-form">
            <form action="#" method="POST">
                
                
                
                <h2 class="section-title">Contact Details</h2>
                
                <div class="spacing"></div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="tel" id="phoneInput" class="input-border" value="+1 (555) 012-3456" placeholder=" " required>
                        <label for="phoneInput" class="floating-label">Phone Number</label>
                        <i class="fas fa-check-circle icon-right icon-verified"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="email" id="emailInput" class="input-border" value="alex.rivera@example.com" placeholder=" " required>
                        <label for="emailInput" class="floating-label">Email Address</label>
                        <i class="fas fa-check-circle icon-right icon-verified"></i>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <textarea id="addressInput" class="input-border" placeholder=" "></textarea>
                        <label for="addressInput" class="floating-label">Street, Apartment, Suite, Floor</label>
                    </div>
                </div>

                <h2 class="section-title">Emergency Contact</h2>
                <div class="spacing"></div>
                

                 <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="emergencyName" class="input-border" placeholder=" ">
                        <label for="emergencyName" class="floating-label">Emergency Contact</label>
                    </div>
                </div>

                
                <div class="form-group">
                    <div class="input-wrapper">
                        <select id="relationshipInput" class="input-border" required>
                            <option value="" disabled selected hidden></option>
                            <option>Spouse</option>
                            <option>Parent</option>
                            <option>Sibling</option>
                            <option>Friend</option>
                            <option>Other</option>
                        </select>
                        <label for="relationshipInput" class="floating-label">Relationship</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="tel" id="emergencyPhone" class="input-border" value=" " placeholder=" " required>
                        <label for="emergencyPhone" class="floating-label">Emergency Contact Number</label>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary btn-full">
                    Save & Next <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
                
            </form>
        </main>
    </div>

    <script src="../../js/user-profile.js"></script>
</body>
</html>
