<!DOCTYPE html>
<html lang="en">
<!-- =======================================================================
     HEAD SECTION
     ======================================================================= -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Personal Details Form</title>
    
    <!-- Link to global styles for shared components and variables -->
    <link rel="stylesheet" href="../../css/global.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           PROFILE COMPLETION SPECIFIC STYLES
           ========================================================================== */
        
        /* Header adjustments */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) var(--container-padding) var(--spacing-sm);
        }
        
        .back-btn {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 20px;
        }
        
        .header-title {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
        }
        
        /* Progress Bar */
        .progress-container {
            display: flex;
            gap: var(--spacing-sm);
            padding: 0 var(--spacing-2xl);
            margin-bottom: var(--spacing-lg);
        }
        
        .step {
            height: 6px;
            flex: 1;
            background: var(--border-light);
            border-radius: var(--border-radius-pill);
        }
        
        .step.active {
            background: var(--primary-color);
        }
        
        /* Info Box using global theme colors */
        .info-box {
            background-color: var(--bg-subtle);
            border: 1px solid var(--blue-accent);
            border-radius: var(--border-radius-xl);
            margin: 0 var(--container-padding) 0;
            padding: 10px var(--spacing-md);
            display: flex;
            gap: var(--spacing-md);
            align-items: flex-start;
        }
        
        .info-box i {
            color: var(--primary-color);
            margin-top: 2px;
        }
        
        .info-box p {
            font-size: 12px;
            color: var(--text-light);
            margin: 0;
            line-height: 1.4;
        }
        
        /* Form spacing overrides */
        .profile-form {
            padding: 0 var(--container-padding) var(--spacing-xl);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .input-label span {
            color: #ef4444;
        }
        
        .input-wrapper .input-border {
            width: 100%;
            height: 44px; /* Reduced from 50px */
            padding-right: 40px; /* Room for FontAwesome icon */
        }
        
        .icon-right {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            opacity: 0.6;
        }
        
        /* Gender Custom Toggle */
        .gender-toggle {
            display: flex;
            align-items: center;
            box-sizing: border-box;
            height: 44px; /* Match height of other inputs */
            width: 100%; /* Ensure it spans the full width like other inputs */
            background: var(--bg-color);
            border-radius: var(--border-radius-xl);
            padding: 4px;
            border: 1.5px solid var(--border-light);
            gap: 4px; /* Adds space between options */
        }
        
        .gender-option {
            flex: 1;
            height: 100%; /* Fill the parent's height */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--border-radius-lg);
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        
        .gender-option.active {
            background: #ffffff;
            color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }
        
        /* Custom select element override */
        select.input-border {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }
        
        /* ==========================================================================
           MODERN FORM STYLING: FLOATING LABELS
           ========================================================================== */
        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .floating-label {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s ease-in-out;
            background-color: var(--bg-color);
            padding: 0 4px;
        }

        /* State for when the input is focused or has content */
        .input-border:focus ~ .floating-label,
        .input-border:not(:placeholder-shown) ~ .floating-label,
        .input-border:valid ~ .floating-label,
        .input-wrapper.has-content > .floating-label {
            top: 0;
            left: 12px;
            font-size: 12px;
            color: var(--primary-color);
            font-weight: 500;
        }

        /* Hide native date format until a value is selected */
        input[type="date"]:not(:valid) { color: transparent; }

        /* Ensure text in date input aligns to the start */
        input[type="date"] {
            text-align: left;
            color: var(--text-primary);
            position: relative;
        }

        /* Custom date picker icon alignment to match native icon position over custom icon */
        input[type="date"]::-webkit-calendar-picker-indicator {
            position: absolute;
            right: 15px;
            opacity: 0;
            cursor: pointer;
            width: 24px;
            height: 24px;
            margin: 0;
            z-index: 2;
        }
        
        /* Action Button overrides */
        .btn-primary.btn-full {
            margin-top: var(--spacing-xl);
            margin-bottom: 0;
        }
    </style>
</head>

<!-- =======================================================================
     BODY SECTION
     ======================================================================= -->
<body>
    <div class="mobile-container">
        
        <!-- ===================================================================
             HEADER SECTION
             =================================================================== -->
        <header class="profile-header">
            <a href="../02-registration/account verified.html" class="back-btn" aria-label="Go back">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="header-title">Personal Details</h1>
            <!-- Reusing Heali's small avatar instead of the static internet image -->
            <img src="../../assets/images/Heali.png" alt="Heali Mascot" class="heali-small" style="margin: 0;">
        </header>
        
        <!-- ===================================================================
             PROGRESS INDICATOR
             =================================================================== -->
        <div class="progress-container" aria-label="Profile completion progress">
            <div class="step active"></div>
            <div class="step"></div>
            <div class="step"></div>
        </div>
        
        <!-- ===================================================================
             INFO BANNER
             =================================================================== -->
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <p>This information is used only for identity verification and is never shared with third parties.</p>
        </div>
        
        <!-- ===================================================================
             FORM SECTION
             =================================================================== -->
        <main class="profile-form">
            <form action="#" method="POST">
                
                <!-- Full Name -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="fullNameInput" class="input-border" value="Jonathan Alexander" placeholder=" " readonly required>
                        <label for="fullNameInput" class="floating-label">Full Name <span>*</span></label>
                        <i id="editNameBtn" class="fas fa-pencil-alt icon-right" style="cursor: pointer;" title="Edit name"></i>
                    </div>
                </div>
                
                <!-- Date of Birth -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="date" id="dobInput" class="input-border" value="1992-08-15" placeholder=" ">
                        <label for="dobInput" class="floating-label">Date of Birth</label>
                        <i class="far fa-calendar-alt icon-right" style="pointer-events: none;"></i>
                    </div>
                </div>

                <!-- Gender Toggle -->
                <div class="form-group" style="margin-bottom: var(--spacing-2xl);">
                    <div class="input-wrapper has-content">
                        <div class="gender-toggle" id="genderToggle">
                            <div class="gender-option active">Male</div>
                            <div class="gender-option">Female</div>
                            <div class="gender-option">Other</div>
                        </div>
                        <label for="genderToggle" class="floating-label">Gender</label>
                    </div>
                </div>
                
                <!-- Occupation -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="occupationInput" class="input-border" placeholder=" ">
                        <label for="occupationInput" class="floating-label">Occupation</label>
                    </div>
                </div>
                
                <!-- Marital Status Dropdown -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <select id="maritalStatusInput" class="input-border" required>
                            <option value="" disabled selected hidden></option>
                            <option>Married</option>
                            <option>Single</option>
                            <option>Divorced</option>
                        </select>
                        <label for="maritalStatusInput" class="floating-label">Marital Status</label>
                    </div>
                </div>
                
                <!-- Action Button -->
                <a href="./User profile 02.html" class="btn-primary btn-full" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    Save & Next <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                </a>
                
            </form>
        </main>
        
    </div>

    <!-- Script for profile page interactions -->
    <script src="../../js/user-profile.js"></script>
</body>
</html>
