<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Splash</title>
    
    <!-- Link to global CSS for shared styles -->
    <link rel="stylesheet" href="./css/global.css"/>
</head>
<!-- The onclick attribute redirects the user to the onboarding workflow when any part of the screen is clicked -->
<body onclick="window.location.href='./workflows/01-onboarding/index.html'">
    <div class="mobile-container splash-mobile">
        <div class="splash-container">
            <!-- Logo block -->
            <div class="splash-logo">
                <!-- Tries to load the logo image, falls back to text if it fails -->
                <img src="./assets/images/Logo.png" alt="Telehealings Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                <div class="splash-logo-text">✦</div>
            </div>
            
            <!-- App Title and Subtitle -->
            <h1 class="splash-title">Telehealings</h1>
            <p class="splash-subtitle">Continuity-First Wellness Care Platform</p>
            
            <!-- Call to action hint -->
            <p class="splash-hint">Tap anywhere to start</p>
        </div>
    </div>
</body>
</html>
