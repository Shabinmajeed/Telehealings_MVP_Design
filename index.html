<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Splash</title>
    
    <!-- Link to global CSS for shared styles -->
    <link rel="stylesheet" href="softonboarding.css">
    
    <!-- Local styles specific to the splash screen -->
    <style>
        /* CSS Reset: removes default margins and paddings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* HTML styling: neutral background for desktop viewing and centering the mobile frame */
        html {
            background-color: #f4f7f6; /* Soft neutral background on desktop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Body styling: constrained to mobile width (360px), blue gradient background */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1E5AA8 0%, #4A90E2 100%);
            width: 100%;
            max-width: 380px; /* Limit width to mobile screen size */
            height: 100vh;
            max-height: 800px; /* Optional limit on vertical height for tall screens */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer; /* Indicates the whole page is clickable */
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* Removes touch highlight on mobile */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); /* Shadow to make it pop like a phone frame */
            position: relative;
        }

        /* Add rounded corners on desktop views where the height is taller than the phone frame */
        @media (min-height: 800px) {
            body {
                border-radius: 40px; /* Simulates a phone's rounded corners */
            }
        }

        /* Container for all splash content, centered vertically and horizontally */
        .splash-container {
            text-align: center;
            color: white;
            animation: fadeIn 1.2s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%; /* Ensures it takes up the full width of the mobile constraint */
        }

        /* Logo styling: scaled down for 360px screen, white circle, floating animation */
        .logo {
            width: 120px; /* Scaled down from 140px */
            height: 120px;
            margin-bottom: 30px;
            animation: float 4s ease-in-out infinite;
            background: white;
            border-radius: 50%;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Make logo image fill the container while maintaining aspect ratio */
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Fallback text if the image fails to load */
        .logo-text-fallback {
            display: none;
            font-size: 56px;
            color: #1E5AA8;
        }

        /* Main title styling, scaled down for 360px width */
        h1 {
            font-size: 36px; /* Scaled down from 48px */
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        /* Subtitle styling, scaled down for mobile */
        .subtitle {
            font-size: 16px; /* Scaled down from 20px */
            font-weight: 500;
            opacity: 0.9;
            letter-spacing: 0.5px;
            margin-bottom: 40px;
        }

        /* Pulsing hint text to prompt user action */
        .click-hint {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            animation: pulseHint 2s infinite;
        }

        /* Animation Keyframes */
        
        /* Fades in the container from the bottom */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Makes the logo float up and down */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Makes the hint text pulse in opacity */
        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }
    </style>
</head>
<!-- The onclick attribute redirects the user to the onboarding workflow when any part of the screen is clicked -->
<body onclick="window.location.href='workflows/01-onboarding/index.html'">
    <div class="splash-container">
        <!-- Logo block -->
        <div class="logo">
            <!-- Tries to load the logo image, falls back to text if it fails -->
            <img src="assets/images/Logo.png" alt="Telehealings Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <div class="logo-text-fallback">✦</div>
        </div>
        
        <!-- App Title and Subtitle -->
        <h1>Telehealings</h1>
        <p class="subtitle">Continuity-First Wellness Care Platform</p>
        
        <!-- Call to action hint -->
        <p class="click-hint">Tap anywhere to start</p>
    </div>
</body>
</html>
